# Release config consumed by `byt release` (ADR-0021).
# The reusable workflow builds linux-gnu in the byt container (glibc floor) and
# *-apple-darwin natively on a macOS runner, then combines + publishes.
[release]
name = "ignr"
lang = "rust"
bins = ["ignr"]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[release.homebrew]
formula = "ignr"

[release.aur]
pkgname = "ignr"
pkgdesc = "Auto-detect languages/tools and generate .gitignore files"
license = "MIT"
url = "https://github.com/byteowlz/ignr"
depends = ["gcc-libs"]
